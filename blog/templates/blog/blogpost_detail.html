<!DOCTYPE html>
<html>
<head>
    <title>{{ object.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>{{ object.title }}</h1>
        <p class="text-muted">Просмотров: {{ object.views_count }}</p>
        <p>{{ object.content }}</p>
        
        <div class="mt-4">
            <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Назад к списку</a>
            <a href="{% url 'blog:post_update' object.pk %}" class="btn btn-warning">Редактировать</a>
            <a href="{% url 'blog:post_delete' object.pk %}" class="btn btn-danger">Удалить</a>
        </div>
    </div>
</body>
</html>
