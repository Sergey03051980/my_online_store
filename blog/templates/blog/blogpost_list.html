<!DOCTYPE html>
<html>
<head>
    <title>Блог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Наш блог</h1>
        <a href="{% url 'blog:post_create' %}" class="btn btn-primary mb-3">Создать запись</a>

        {% for post in object_list %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text">{{ post.content|truncatewords:30 }}</p>
                <p class="text-muted">Просмотров: {{ post.views_count }}</p>
                <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-primary">Читать</a>
            </div>
        </div>
        {% empty %}
        <p>Пока нет записей в блоге.</p>
        {% endfor %}
    </div>
</body>
</html>
