<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой Магазин{% endblock %}</title>
    <!-- Bootstrap CSS (ДОБАВЛЯЕМ) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Подшаблон навигационного меню (УЖЕ ЕСТЬ) -->
    {% include 'catalog/includes/main_menu.html' %}

    <main class="container my-4"> <!-- Добавляем классы Bootstrap -->
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-light text-center py-3 mt-5"> <!-- Добавляем футер -->
        <div class="container">
            &copy; Мой Магазин {% now "Y" %}
        </div>
    </footer>

    <!-- Bootstrap JS (ДОБАВЛЯЕМ) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
