<!DOCTYPE html>
<html>
<head>
    <title>Главная - Мой Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Мой Магазин</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/">Главная</a>
                <a class="nav-link" href="/contacts/">Контакты</a>
                <a class="nav-link" href="/blog/">Блог</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Добро пожаловать в мой магазин!</h1>
        <p>Это главная страница магазина.</p>
        
        <div class="row">
            {% for product in products %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text">{{ product.description|truncatechars:100 }}</p>
                        <p class="card-text"><strong>{{ product.price }} руб.</strong></p>
                        <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-primary">Подробнее</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
<!-- После списка продуктов добавьте -->
<div class="mt-4">
    <a href="{% url 'catalog:product_create' %}" class="btn btn-primary">Добавить новый продукт</a>
</div>
