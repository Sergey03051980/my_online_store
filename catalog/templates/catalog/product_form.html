{% extends 'catalog/base.html' %}

{% block title %}Добавить товар - Мой Магазин{% endblock %}

{% block content %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'catalog:home' %}">Главная</a></li>
            <li class="breadcrumb-item active" aria-current="page">Добавить товар</li>
        </ol>
    </nav>

    <h2>Добавить новый товар</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить товар</button>
        <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
